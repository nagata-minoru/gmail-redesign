name: GitHub Pages

# Gmail 連携の開発に入ったため、main への push では公開しない（AGENTS.md の方針）。
# 公開サイトはダミーデータ版のまま更新されない。再び公開するときは、連携のコードが含まれないことを確かめて手動で実行する。
on:
  workflow_dispatch:

# 公開は 1 つずつ行う。実行中の公開は途中で取り消さない
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Web 向けに書き出す
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: 依存パッケージを入れる
        run: npm ci

      - name: サブパス（/gmail-redesign）向けに書き出す
        run: npm run build:pages

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: GitHub Pages に公開する
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
