# GitHub Actions のバージョンだけを毎週確かめ、更新があれば PR を作る。
# npm の依存は Expo の SDK に合わせて上げるため、ここでは対象にしない。
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - '*'
